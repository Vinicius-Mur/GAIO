spring.application.name=calculadora-imobiliaria

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gaio_calculadora}
spring.datasource.username=${DB_USER:gaio}
spring.datasource.password=${DB_PASSWORD:gaio}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.ml-service.mock=${ML_SERVICE_MOCK:true}
app.ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}

app.jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-para-um-valor-secreto-longo-e-aleatorio}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/docs
